# macOS-style line navigation: ALT+left/right = start/end of line, in every app.
# Keys mapped in the [alt] layer are sent without ALT; everything else is untouched.
[ids]
*

[alt]
left = home
right = end

# ALT+SHIFT+left/right = select to start/end of line
[alt+shift]
left = S-home
right = S-end

# macOS-style tab switching: CTRL+SHIFT+[ / ] = previous / next tab, in every app
# (sent as CTRL+PageUp / CTRL+PageDown, the standard Linux tab keys)
[control+shift]
leftbrace = C-pageup
rightbrace = C-pagedown
