# macOS-style lock screen, matching the Quickshell glass bar (Power > Lock)
$font = Inter

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.7
    vibrancy = 0.2
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(245, 245, 247, 0.85)
    font_size = 22
    font_family = $font Medium
    position = 0, -150
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(245, 245, 247, 0.95)
    font_size = 110
    font_family = $font Bold
    position = 0, -185
    halign = center
    valign = top
}

# User
label {
    monitor =
    text = $USER
    color = rgba(245, 245, 247, 0.9)
    font_size = 15
    font_family = $font SemiBold
    position = 0, -70
    halign = center
    valign = center
}

# Glass password pill
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.14)
    outer_color = rgba(255, 255, 255, 0.22)
    check_color = rgba(10, 132, 255, 0.8)
    fail_color = rgba(255, 69, 58, 0.8)
    font_color = rgba(245, 245, 247, 1.0)
    font_family = $font
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    fail_text = <span foreground="##ff453a">$FAIL</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -120
    halign = center
    valign = center
}
