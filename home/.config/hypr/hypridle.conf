# Idle handling (burn-in care for the WOLED): screen off after 10 minutes.
# Videos/fullscreen apps that inhibit idle (YouTube, players) keep the screen on.
general {
    # Hyprland uses the Lua config: dispatchers take Lua syntax
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
